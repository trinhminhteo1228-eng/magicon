name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Project Dependencies
        run: |
          npm install

      - name: Initialize Capacitor iOS Platform
        run: |
          npx cap add ios
          npx cap copy ios

      - name: Build Xcode Project (Simulator / Generic)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphonesimulator \
                     build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
