name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Project Dependencies
        run: |
          npm install

      - name: Initialize Capacitor iOS Platform
        run: |
          npx cap add ios
          npx cap copy ios

      - name: Verify Build Output
        run: |
          ls -la ios/App
